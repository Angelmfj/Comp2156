name: Deploy React App COMP2156 DevOps Project CI
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on:
  pull_request:
    branches: ["main","dep-inclusions"] # Ajusta según tu rama principal
  push: 
    branches: ["dep-inclusions", "main"]

jobs:
  build:
    runs-on: ubuntu-latest # Última versión de Ubuntu

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x" # La versión de Node adecuada para tu proyecto

     
      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: node_modules # Tomar el último cache si falla con el package-lock.json actual  
          
   
      - name: Install dependencies
        run: npm install

     
      - name: Build the app
        run: npm run build

    
      - name: Run test
        run: CI=true npm test

     
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./build
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
